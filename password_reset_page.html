<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMonitor Protocol - Password Reset</title>
    <!-- Supabase Client from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: #1a1a1a;
            font-size: 1.5rem;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #0070f3;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #0051a2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #normalBoard {
            display: block;
        }

        #resetBoard {
            display: none;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Default Landing View -->
        <div id="normalBoard">
            <div class="logo">🛡️</div>
            <h1>eMonitor Protocol</h1>
            <p class="subtitle">Secure Endpoint Monitoring System</p>
            <p style="font-size: 0.9rem; color: #888;">
                System is online.<br><br>
                <em>If you are here to reset your password,<br> please click the link in your email again.</em>
            </p>
        </div>

        <!-- Hidden Reset Password View (Activates on recovery link) -->
        <div id="resetBoard">
            <div class="logo">🔐</div>
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new secure password below.</p>

            <form onsubmit="event.preventDefault(); updatePassword();">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                <button type="submit" id="btnSave">Update Password</button>
            </form>

            <div id="msg" class="message"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION - REPLACE THESE VALUES
        // ==========================================
        // Go to your Python project -> config.py -> Copy URL and KEY here
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        // ==========================================

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /**
         * Detects if the user arrived via a "Password Recovery" link.
         * The link will contain #access_token=...&type=recovery
         */
        supabase.auth.onAuthStateChange(async (event, session) => {
            console.log("Auth Event Detected:", event);

            if (event === "PASSWORD_RECOVERY") {
                // Swith to the Reset Password UI
                document.getElementById('normalBoard').style.display = 'none';
                document.getElementById('resetBoard').style.display = 'block';
            }
        });

        async function updatePassword() {
            const password = document.getElementById('newPassword').value;
            const btn = document.getElementById('btnSave');

            if (!password || password.length < 6) {
                showMsg("Password must be at least 6 characters", "error");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Updating...";
            showMsg("", "none"); // Clear message

            try {
                const { data, error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                showMsg("✅ Password updated successfully! You can now login to the Desktop App.", "success");
                btn.textContent = "Updated";
                document.getElementById('newPassword').disabled = true;

            } catch (error) {
                showMsg("❌ " + error.message, "error");
                btn.disabled = false;
                btn.textContent = "Update Password";
            }
        }

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            if (type === "none") {
                msg.style.display = 'none';
                return;
            }
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>

</html>
